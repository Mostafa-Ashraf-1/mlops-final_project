[project]
name = "final-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
final-project = "final_project:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
production = [
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "onnx>=1.23.0",
    "onnxruntime>=1.30.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "uvicorn>=0.53.0",
]
dev = [
    "dvc>=3.67.1",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.0",
]
